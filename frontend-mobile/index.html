<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caritas HARVEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #b10017;
      --warm-white: #fffdf9;
      --text-muted: rgba(44, 34, 24, 0.36);
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Nunito', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--warm-white);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .brand-logo { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; box-shadow: 0 4px 24px rgba(44, 34, 24, 0.1); }
    .title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--red); margin-top: 18px; }
    .hint { margin-top: 10px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 22px auto 0;
      border: 3px solid rgba(177, 0, 23, 0.15);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <img class="brand-logo" src="../assets/caritas_internationalis_logo.jpeg" alt="Caritas" />
    <div class="title">Caritas HARVEST</div>
    <div class="hint">Loading…</div>
    <div class="spinner"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // App entry: signed-in reporters go to the hub, everyone else to login.
    const claims = Session.access && decodeToken(Session.access);
    if (claims && claims.role === 'reporter') {
      window.location.replace('home.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
