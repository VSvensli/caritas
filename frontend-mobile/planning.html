<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caritas Mobile – Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #b10017;
      --red-dark: #8f0012;
      --red-glow: rgba(177, 0, 23, 0.07);
      --green: #5c7830;
      --green-light: rgba(92, 120, 48, 0.09);
      --amber: #9c6d20;
      --amber-light: rgba(156, 109, 32, 0.08);
      --cream: #faf7f2;
      --warm-white: #fffdf9;
      --text: #2c2218;
      --text-secondary: rgba(44, 34, 24, 0.58);
      --text-muted: rgba(44, 34, 24, 0.36);
      --border: rgba(44, 34, 24, 0.09);
      --shadow: 0 4px 24px rgba(44, 34, 24, 0.06);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-pill: 999px;
      --app-w: 480px;
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Nunito', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--warm-white);
      min-height: 100dvh;
    }

    .screen { width: min(var(--app-w), 100%); margin: 0 auto; min-height: 100dvh; position: relative; }
    .content { padding: 22px 20px 32px; position: relative; z-index: 1; }

    /* ── header ── */
    .screen-header { display: flex; align-items: center; gap: 12px; padding: 4px 0 6px; }

    .btn-back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: white;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s;
      color: var(--text);
    }

    .btn-back:active { transform: scale(0.93); }
    .screen-title { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; color: var(--red); line-height: 1.1; }
    .screen-sub { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }

    /* ── upcoming badge ── */
    .upcoming-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      margin-top: 16px;
      border-radius: var(--radius-pill);
      background: var(--red-glow);
      border: 1px solid rgba(177, 0, 23, 0.12);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--red);
    }

    .upcoming-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 2s ease-in-out infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── timeline ── */
    .timeline { margin-top: 18px; position: relative; padding-left: 60px; }
    .timeline-line { position: absolute; left: 27px; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .tl-event { position: relative; margin-top: 18px; }
    .tl-event:first-child { margin-top: 0; }

    .tl-date { position: absolute; left: -60px; top: 0; width: 54px; text-align: center; z-index: 1; }

    .tl-day {
      width: 48px;
      height: 48px;
      margin: 0 auto;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      background: white;
      border: 2px solid var(--border);
    }

    .tl-day-green { border-color: rgba(92, 120, 48, 0.3); color: var(--green); background: var(--green-light); }
    .tl-day-amber { border-color: rgba(156, 109, 32, 0.25); color: var(--amber); background: var(--amber-light); }
    .tl-day-red { border-color: rgba(177, 0, 23, 0.25); color: var(--red); background: var(--red-glow); }

    .tl-month-label { margin-top: 4px; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }

    .tl-next {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: var(--radius-pill);
      background: var(--red);
      color: white;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tl-next-dot { width: 5px; height: 5px; border-radius: 50%; background: white; animation: pulse 1.5s ease-in-out infinite; }

    .tl-card { padding: 16px 18px; border-radius: var(--radius); background: white; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .tl-card-highlight { border-color: rgba(177, 0, 23, 0.14); background: linear-gradient(175deg, rgba(177, 0, 23, 0.025) 0%, white 40%); }

    .tl-tag { display: inline-flex; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 0.64rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .tl-tag-prep { background: var(--green-light); color: var(--green); }
    .tl-tag-plant { background: var(--red-glow); color: var(--red); }
    .tl-tag-harvest { background: var(--amber-light); color: var(--amber); }
    .tl-tag-report { background: rgba(44, 34, 24, 0.05); color: var(--text-secondary); }

    .tl-title { margin-top: 8px; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .tl-desc { margin-top: 4px; font-size: 0.84rem; color: var(--text-secondary); line-height: 1.5; }
    .tl-meta { margin-top: 6px; font-size: 0.74rem; color: var(--text-muted); font-weight: 700; }

    /* ── subtasks ── */
    .subtask-list { margin-top: 14px; display: grid; gap: 10px; }
    .subtask { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
    .subtask-check { width: 22px; height: 22px; margin-top: 1px; border-radius: 7px; flex-shrink: 0; display: grid; place-items: center; }
    .subtask-check-empty { background: var(--cream); border: 2px solid var(--border); }
    .subtask-check-done { background: var(--green); border: 2px solid var(--green); color: white; }
    .subtask-body { min-width: 0; }
    .subtask-name { font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
    .subtask-name.done { text-decoration: line-through; color: var(--text-muted); }
    .subtask-desc { margin-top: 2px; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.45; }

    /* ── states ── */
    .state {
      margin-top: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .anim { animation: fadeUp 0.45s ease-out both; }
    .anim-1 { animation-delay: 0.04s; }
    .anim-2 { animation-delay: 0.1s; }
    .anim-3 { animation-delay: 0.16s; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="content">
      <div class="screen-header anim anim-1">
        <a class="btn-back" href="home.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <div>
          <div class="screen-sub">Kalender Pertanian</div>
          <h2 class="screen-title">Farm Calendar</h2>
        </div>
      </div>

      <div id="upcoming" class="anim anim-2"></div>
      <div id="timeline"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const claims = requireReporter();

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // Map a task_type to a visual style.
    function styleFor(type) {
      const t = (type || '').toLowerCase();
      if (t.includes('plant')) return { day: 'tl-day-red', tag: 'tl-tag-plant' };
      if (t.includes('harvest')) return { day: 'tl-day-amber', tag: 'tl-tag-harvest' };
      if (t.includes('report')) return { day: 'tl-day', tag: 'tl-tag-report' };
      return { day: 'tl-day-green', tag: 'tl-tag-prep' };
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function dayParts(iso) {
      if (!iso) return { day: '–', month: '' };
      const d = new Date(iso + 'T00:00:00');
      return { day: d.getDate(), month: MONTHS[d.getMonth()] };
    }

    function subtaskRow(st) {
      const done = st.is_done;
      const check = done
        ? '<div class="subtask-check subtask-check-done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>'
        : '<div class="subtask-check subtask-check-empty"></div>';
      const parts = dayParts(st.due_date);
      const due = st.due_date ? '<div class="subtask-desc">Due ' + parts.day + ' ' + parts.month + '</div>' : '';
      return (
        '<div class="subtask">' + check +
        '<div class="subtask-body"><div class="subtask-name' + (done ? ' done' : '') + '">' +
        escapeHtml(st.title) + '</div>' + due + '</div></div>'
      );
    }

    function eventCard(task, isNext) {
      const s = styleFor(task.task_type);
      const parts = dayParts(task.due_date);
      const nextBadge = isNext ? '<div class="tl-next"><span class="tl-next-dot"></span> Next</div>' : '';
      const subtasks = (task.subtasks || []).length
        ? '<div class="subtask-list">' + task.subtasks.map(subtaskRow).join('') + '</div>'
        : '';
      const desc = task.description ? '<div class="tl-desc">' + escapeHtml(task.description) + '</div>' : '';
      return (
        '<div class="tl-event">' +
          '<div class="tl-date"><div class="tl-day ' + s.day + '">' + parts.day + '</div>' +
            '<div class="tl-month-label">' + parts.month + '</div>' + nextBadge + '</div>' +
          '<div class="tl-card' + (isNext ? ' tl-card-highlight' : '') + '">' +
            '<span class="tl-tag ' + s.tag + '">' + escapeHtml(task.task_type || 'Task') + '</span>' +
            '<div class="tl-title">' + escapeHtml(task.title) + '</div>' + desc +
            '<div class="tl-meta">' + escapeHtml(task.season || '') + ' ' + (task.year || '') + '</div>' +
            subtasks +
          '</div>' +
        '</div>'
      );
    }

    async function init() {
      if (!claims) return;
      const timelineEl = document.getElementById('timeline');
      const upcomingEl = document.getElementById('upcoming');

      if (!claims.village_id) {
        timelineEl.innerHTML = '<div class="state">You are not assigned to a village yet.</div>';
        return;
      }

      let tasks;
      try {
        tasks = await api('/villages/' + claims.village_id + '/calendar').then((r) => r.json());
      } catch (err) {
        timelineEl.innerHTML = '<div class="state">Could not load the calendar. Please try again.</div>';
        return;
      }

      if (!Array.isArray(tasks) || tasks.length === 0) {
        timelineEl.innerHTML = '<div class="state">No farm tasks scheduled yet.<br>Check back later.</div>';
        return;
      }

      // Sort by due date ascending (undated last).
      tasks.sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));

      const today = new Date().toISOString().slice(0, 10);
      const nextTask = tasks.find((t) => t.due_date && t.due_date >= today);

      if (nextTask) {
        const p = dayParts(nextTask.due_date);
        upcomingEl.innerHTML =
          '<div class="upcoming-badge"><span class="upcoming-pulse"></span> Next: ' +
          escapeHtml(nextTask.title) + ' on ' + p.day + ' ' + p.month + '</div>';
      }

      timelineEl.innerHTML =
        '<div class="timeline anim anim-3"><div class="timeline-line"></div>' +
        tasks.map((t) => eventCard(t, nextTask && t.id === nextTask.id)).join('') +
        '</div>';
    }

    init();
  </script>
</body>
</html>
