<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caritas Mobile – Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #b10017;
      --red-dark: #8f0012;
      --red-glow: rgba(177, 0, 23, 0.07);
      --green: #5c7830;
      --green-light: rgba(92, 120, 48, 0.09);
      --cream: #faf7f2;
      --warm-white: #fffdf9;
      --text: #2c2218;
      --text-secondary: rgba(44, 34, 24, 0.58);
      --text-muted: rgba(44, 34, 24, 0.36);
      --border: rgba(44, 34, 24, 0.09);
      --shadow: 0 4px 24px rgba(44, 34, 24, 0.06);
      --shadow-lg: 0 12px 40px rgba(44, 34, 24, 0.09);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-pill: 999px;
      --app-w: 480px;
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Nunito', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--warm-white);
      min-height: 100dvh;
    }

    .screen {
      width: min(var(--app-w), 100%);
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
    }

    .content { padding: 22px 20px 32px; position: relative; z-index: 1; }

    /* ── top bar ── */
    .top-bar { display: flex; justify-content: space-between; align-items: center; }

    .hamburger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: white;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .hamburger:active { background: var(--cream); }

    .hamburger-lines { display: flex; flex-direction: column; gap: 4px; width: 18px; }
    .hamburger-lines span { display: block; height: 2px; border-radius: 1px; background: var(--text); }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: white;
      font-weight: 800;
      font-size: 0.82rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(177, 0, 23, 0.2);
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── dropdown ── */
    .dropdown {
      display: none;
      position: absolute;
      top: 52px;
      left: 0;
      width: 220px;
      padding: 8px;
      border-radius: var(--radius-sm);
      background: white;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 10;
    }

    .dropdown.open { display: block; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
    }

    .dropdown-item:hover { background: var(--cream); }
    .dropdown-item svg { flex-shrink: 0; color: var(--text-muted); }
    .dropdown-divider { height: 1px; background: var(--border); margin: 4px 8px; }

    .dropdown-backdrop { display: none; position: fixed; inset: 0; z-index: 9; }
    .dropdown-backdrop.open { display: block; }

    /* ── greeting ── */
    .greeting { padding: 14px 0 0; }

    .greeting-label {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .greeting-name {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--red);
      line-height: 1.05;
      margin-top: 2px;
      min-height: 2.1rem;
    }

    .greeting-village { font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px; }

    /* ── nav list ── */
    .nav-list { margin-top: 22px; display: grid; gap: 10px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px 16px 14px;
      border-radius: var(--radius);
      background: white;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item:active { transform: scale(0.98); }

    .nav-item-primary {
      background: linear-gradient(135deg, #b10017 0%, #8f0012 100%);
      color: white;
      border: none;
      box-shadow: 0 6px 24px rgba(177, 0, 23, 0.2);
    }

    .nav-item-wip { opacity: 0.75; cursor: default; }
    .nav-item-wip:active { transform: none; }

    .nav-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .nav-icon-red { background: var(--red-glow); color: var(--red); }
    .nav-icon-green { background: var(--green-light); color: var(--green); }
    .nav-icon-purple { background: rgba(109, 76, 155, 0.1); color: #6d4c9b; }
    .nav-icon-teal { background: rgba(45, 125, 154, 0.1); color: #2d7d9a; }
    .nav-icon-orange { background: rgba(194, 120, 40, 0.1); color: #c27828; }

    .nav-item-primary .nav-icon { background: rgba(255, 255, 255, 0.14); color: white; }

    .nav-body { flex: 1; min-width: 0; }

    .nav-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .nav-desc { margin-top: 2px; font-size: 0.82rem; line-height: 1.4; color: var(--text-secondary); }
    .nav-item-primary .nav-desc { color: rgba(255, 255, 255, 0.72); }

    .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .nav-arrow { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(44, 34, 24, 0.05); color: var(--text-muted); }
    .nav-item-primary .nav-arrow { background: rgba(255, 255, 255, 0.12); }

    .wip-badge {
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      background: rgba(44, 34, 24, 0.06);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .leaf-deco {
      position: absolute;
      top: 40px;
      right: -10px;
      width: 120px;
      height: 120px;
      opacity: 0.06;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim { animation: fadeUp 0.4s ease-out both; }
    .anim-1 { animation-delay: 0.04s; }
    .anim-2 { animation-delay: 0.08s; }
    .anim-3 { animation-delay: 0.12s; }
    .anim-4 { animation-delay: 0.16s; }
    .anim-5 { animation-delay: 0.20s; }
    .anim-6 { animation-delay: 0.24s; }
    .anim-7 { animation-delay: 0.28s; }
  </style>
</head>
<body>
  <div class="screen">
    <svg class="leaf-deco" viewBox="0 0 120 120" fill="none">
      <path d="M60 8C38 30 22 58 34 82C46 106 60 112 60 112C60 112 74 106 86 82C98 58 82 30 60 8Z" fill="#5c7830" />
      <path d="M60 22V105" stroke="#fff" stroke-width="1.5" opacity="0.3" />
      <path d="M60 48C48 42 40 48 36 58" stroke="#fff" stroke-width="1" fill="none" opacity="0.2" />
      <path d="M60 68C72 62 80 68 84 78" stroke="#fff" stroke-width="1" fill="none" opacity="0.2" />
    </svg>

    <div class="content">
      <div class="top-bar anim anim-1">
        <div class="hamburger" id="menuBtn">
          <div class="hamburger-lines"><span></span><span></span><span></span></div>
          <div class="dropdown" id="menuDropdown">
            <a class="dropdown-item" href="home.html">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
              Home
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" id="signOutBtn" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign out
            </button>
          </div>
        </div>
        <div class="avatar" id="avatar">··</div>
      </div>
      <div class="dropdown-backdrop" id="menuBackdrop"></div>

      <section class="greeting anim anim-2">
        <div class="greeting-label">Selamat datang</div>
        <h1 class="greeting-name" id="greetingName">…</h1>
        <div class="greeting-village" id="greetingVillage"></div>
      </section>

      <nav class="nav-list">
        <a class="nav-item nav-item-primary anim anim-3" href="report-form.html">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="nav-body">
            <div class="nav-title">Make Report</div>
            <div class="nav-desc">Send this week's farm update</div>
          </div>
          <div class="nav-right">
            <div class="nav-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </a>

        <a class="nav-item anim anim-4" href="planning.html">
          <div class="nav-icon nav-icon-green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="nav-body">
            <div class="nav-title">Calendar</div>
            <div class="nav-desc">Farm events and tasks ahead</div>
          </div>
          <div class="nav-right">
            <div class="nav-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </a>

        <div class="nav-item nav-item-wip anim anim-5">
          <div class="nav-icon nav-icon-purple">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </div>
          <div class="nav-body">
            <div class="nav-title">Learning Forum</div>
            <div class="nav-desc">Share knowledge with other farmers</div>
          </div>
          <div class="nav-right"><span class="wip-badge">WIP</span></div>
        </div>

        <div class="nav-item nav-item-wip anim anim-6">
          <div class="nav-icon nav-icon-teal">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          </div>
          <div class="nav-body">
            <div class="nav-title">Guide</div>
            <div class="nav-desc">How to use the app</div>
          </div>
          <div class="nav-right"><span class="wip-badge">WIP</span></div>
        </div>

        <div class="nav-item nav-item-wip anim anim-7">
          <div class="nav-icon nav-icon-orange">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div class="nav-body">
            <div class="nav-title">Chat</div>
            <div class="nav-desc">Talk to Caritas staff</div>
          </div>
          <div class="nav-right"><span class="wip-badge">WIP</span></div>
        </div>
      </nav>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const claims = requireReporter();

    // ── menu ──
    const btn = document.getElementById('menuBtn');
    const dropdown = document.getElementById('menuDropdown');
    const backdrop = document.getElementById('menuBackdrop');

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
      backdrop.classList.toggle('open');
    });
    backdrop.addEventListener('click', () => {
      dropdown.classList.remove('open');
      backdrop.classList.remove('open');
    });
    dropdown.addEventListener('click', (e) => e.stopPropagation());
    document.getElementById('signOutBtn').addEventListener('click', logout);

    // ── load reporter + village ──
    async function init() {
      if (!claims) return;
      try {
        const me = await api('/users/me').then((r) => r.json());
        document.getElementById('greetingName').textContent = 'Hi, ' + firstName(me.full_name);
        const avatar = document.getElementById('avatar');
        if (me.image_url) {
          avatar.innerHTML = '<img src="' + me.image_url + '" alt="" />';
        } else {
          avatar.textContent = initials(me.full_name);
        }

        if (me.village_id) {
          const village = await api('/villages/' + me.village_id).then((r) => r.json());
          document.getElementById('greetingVillage').textContent = village.name;
        }
      } catch (err) {
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
